<!doctype html>
<html lang="tr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#09090b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>APEXOS - Akıllı İşletim ve Yönetim Sistemi</title>
  </head>
  <body class="bg-neutral-950 text-text-primary antialiased selection:bg-focus-neon/30 selection:text-white overscroll-none touch-manipulation">
    <div id="root"></div>
    <script>
      window.onerror = function(msg, url, lineNo, columnNo, error) {
        console.error('APEXOS FATAL STARTUP ERROR:', msg, '\nAt:', url, ':', lineNo, ':', columnNo);
        const root = document.getElementById('root');
        if (root && root.innerHTML === '') {
          root.innerHTML = '<div style="background: black; color: red; padding: 20px; font-family: monospace;"><h1>APEXOS FATAL ERROR</h1><p>' + msg + '</p><p>Check console logs for details.</p></div>';
        }
        return false;
      };
      window.onunhandledrejection = function(event) {
        console.error('UNHANDLED REJECTION:', event.reason);
      };
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
